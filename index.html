 a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(36)};

/* ---- Tekstur latar mengikuti warna tema ---- */
function svgTex(c,op=.3){const r=34,w=r*Math.sqrt(3),h=r*3,f=n=>n.toFixed(1),pt=(x,y,a)=>[x+r*Math.cos(a*Math.PI/180),y-r*Math.sin(a*Math.PI/180)],lp=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];let d='';
 for(let j=-1;j<=3;j++)for(let i=-1;i<=2;i++){const x=i*w+(j&1?w/2:0),y=j*1.5*r,o=[x,y],V=a=>pt(x,y,a),Rh=[[o,V(150),V(90),V(30)],[o,V(150),V(210),V(270)],[o,V(30),V(330),V(270)]];
  Rh.forEach(q=>{d+=`M${f(q[0][0])} ${f(q[0][1])}`;for(let k=1;k<4;k++)d+=`L${f(q[k][0])} ${f(q[k][1])}`;d+='Z'});
  [[Rh[0],1],[Rh[1],0],[Rh[2],1]].forEach(([q,m])=>[1/3,2/3].forEach(t=>{const A=m?lp(q[0],q[3],t):lp(q[0],q[1],t),B=m?lp(q[1],q[2],t):lp(q[3],q[2],t);d+=`M${f(A[0])} ${f(A[1])}L${f(B[0])} ${f(B[1])}`}))}
 return{w,h,s:`<svg xmlns="http://www.w3.org/2000/svg" width="${f(w)}" height="${f(h)}" viewBox="0 0 ${f(w)} ${f(h)}"><path d="${d}" fill="none" stroke="${c}" stroke-opacity="${op}" stroke-width="1.1"/></svg>`}}
const bgParts=c=>{const t=svgTex(c);return{bc:`color-mix(in srgb,${c} 5%,white)`,bi:`url('data:image/svg+xml,${encodeURIComponent(t.s)}')`,bs:`${t.w.toFixed(1)}px ${t.h.toFixed(1)}px`}};
const bgStyle=c=>{const p=bgParts(c);return `background-color:${p.bc};background-image:${p.bi};background-size:${p.bs}`};
function plainBg(){const s=document.body.style;s.backgroundImage='none';s.backgroundColor='#f1f5f9'}
const hdrStyle=c=>{const t=svgTex('#ffffff',.2);return `background-color:${c};background-image:url('data:image/svg+xml,${encodeURIComponent(t.s)}');background-size:${t.w.toFixed(1)}px ${t.h.toFixed(1)}px`};
function applyBg(c){const p=bgParts(c),s=document.body.style;s.backgroundColor=p.bc;s.backgroundImage=p.bi;s.backgroundSize=p.bs}

/* ---- Cloud (Firebase Firestore REST, opsional) ---- */
const CL=STU?{pid:QP.get('p'),key:QP.get('k')}:null,cc=()=>STU?CL:(S.cfg||{}),cfgOn=()=>!!(cc().pid&&cc().key);
const cb=()=>`https://firestore.googleapis.com/v1/projects/${cc().pid}/databases/(default)/documents`;
async function cput(col,id,o){const r=await fetch(`${cb()}/${col}/${id}?key=${cc().key}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({fields:{j:{stringValue:JSON.stringify(o)}}})});if(!r.ok){let m=r.status;try{m=(await r.json()).error.message}catch(e){}throw new Error(m)}}
async function cget(col,id){const r=await fetch(`${cb()}/${col}/${id}?key=${cc().key}`);if(r.status==404)return null;const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);return JSON.parse(d.fields.j.stringValue)}
async function clist(col){const out=[];let t='';do{const r=await fetch(`${cb()}/${col}?pageSize=300&key=${cc().key}${t?'&pageToken='+t:''}`),d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);(d.documents||[]).forEach(x=>{try{out.push(JSON.parse(x.fields.j.stringValue))}catch(e){}});t=d.nextPageToken||''}while(t);return out}
const cdel=(col,id)=>fetch(`${cb()}/${col}/${id}?key=${cc().key}`,{method:'DELETE'});

/* ---- Penilaian ---- */
const nrm=s=>{s=String(s??'').toLowerCase().trim().replace(/\s+/g,' ');if(/^-?\d+([.,]\d+)?$/.test(s))return String(parseFloat(s.replace(',','.')));return s.replace(/[.!?]+$/,'').trim()};
function sc(q,a){
 if(a==null)return 0;
 if(q.t=='pg')return a===q.k?1:0;
 if(q.t=='pgk'){const c=a.filter(x=>q.k.includes(x)).length,w=a.length-c;return q.k.length?Math.max(0,(c-w)/q.k.length):0}
 if(q.t=='match')return q.L.length?q.L.filter((x,i)=>a[i]===x.k).length/q.L.length:0;
 if(q.t=='tf')return q.i.length?q.i.filter((x,i)=>a[i]===x.v).length/q.i.length:0;
 if(q.t=='isian'){const ks=String(q.ans||'').split(/;|\n/).map(nrm).filter(Boolean);return ks.includes(nrm(a))?1:0}
 const kw=(q.kw||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean),t=String(a).toLowerCase();
 return kw.length?kw.filter(k=>t.includes(k)).length/kw.length:0}
const noKey=q=>(q.t=='essay'&&!(q.kw||'').trim())||(q.t=='isian'&&!(q.ans||'').trim());
const wq=(e,q)=>noKey(q)?0:e.ptsMode=='manual'?(q.pts??1):1;
const total=(e,ans)=>{const W=e.qs.reduce((t,q)=>t+wq(e,q),0);return W?Math.round(e.qs.reduce((t,q,i)=>t+sc(q,ans[i])*wq(e,q),0)/W*1000)/10:0};

const cur=()=>S.exams.find(e=>e.id==eid),Q=()=>cur().qs[qi];

 if(u){if(!/^https?:\/\//i.test(u))u='https://'+u.replace(/^\/+/,'');if(!u.endsWith('/')&&!/\.html?$/i.test(u))u+='/';return u}
 return isLocalHost()?'':location.href.split(/[?#]/)[0]};
const GEN=/^(SD|SDN|SDS|SMP|SMPN|SMPS|SMA|SMAN|SMAS|SMK|SMKN|SMKS|MI|MIN|MTS|MTSN|MA|MAN|TK|PAUD|SEKOLAH|YAYASAN)$/;
function autoSlug(){const w=(S.inst.name||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean).filter(x=>!GEN.test(x)),a=w.map(x=>/^\d+$/.test(x)?x:x[0]).join('').toLowerCase();return('cbt'+(a||'sekolah')).slice(0,30)}

const STEPS=['Buat <b>KELAS</b> (misalnya 9) di halaman utama.','Buka kelas tersebut, tab <b>Peserta</b>: tambahkan kelas peserta (9A, 9B, 9C, ...) dengan mengetik nama atau mengunggah absen Excel.','Atur <b>warna tema</b> dan pengumuman di tab Warna &amp; Info.','Di tab <b>Jadwal &amp; Soal</b>, buat ujian: atur jadwal, durasi, keamanan, lalu isi soal (manual, impor dari Claude, atau AI).','Klik <b>Simpan &amp; Publikasikan</b>. Untuk perubahan berikutnya cukup klik Publikasikan lagi: link tetap sama dan peserta tinggal login ulang.','Bagikan <b>link siswa</b> dan cetak kartu peserta (nomor &amp; password).','Pantau di tab <b>Monitoring</b> dan unduh rekap nilai Excel.'];

/* --- Login admin --- */
const logged=()=>sessionStorage.getItem(SES)=='1';
function authV(){
 const acc=ld(ACC,null);document.title='EXAM CBT.PLUS ADMIN GITHUB';plainBg();
 app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="card w-full max-w-md space-y-3"><div class="text-center"><div class="inline-flex w-16 h-16 rounded-2xl bg-indigo-600 text-white items-center justify-center text-3xl mb-2"><i class="fa fa-graduation-cap"></i></div><h1 class="text-xl font-extrabold">EXAM CBT.PLUS</h1><p class="text-xs text-slate-500 tracking-widest">ADMIN GITHUB</p></div>
 <p class="text-sm text-slate-600 text-center">${acc?'Selamat datang kembali, Admin! Masukkan email dan password Anda.':'Selamat datang di panel admin EXAM CBT.PLUS! Buat akun admin Anda untuk memulai.'}</p>
 <input id="ae" type="email" class="inp" placeholder="Email Google (contoh: nama@gmail.com)" value="${acc?esc(acc.email):''}" ${acc?'readonly':''}>
 <input id="ap" type="password" class="inp" placeholder="Password" onkeydown="if(event.key=='Enter')${acc?'doLogin()':'doReg()'}">
 ${acc?'':'<input id="ap2" type="password" class="inp" placeholder="Ulangi password">'}
 <p id="am" class="text-sm text-red-600"></p><button class="btn w-full" onclick="${acc?'doLogin()':'doReg()'}">${acc?'Masuk':'Buat akun & masuk'}</button>
 ${acc?'<button class="text-xs text-slate-500 w-full" onclick="forgot()">Lupa password?</button>':''}
 <details class="text-xs text-slate-600"><summary class="cursor-pointer font-semibold">Perangkat baru? Muat data admin dari Firebase (opsional)</summary><p class="mt-2">Hanya jika Anda mengaktifkan Firebase di perangkat utama. Tempel konfigurasinya untuk memuat akun dan data admin.</p><textarea id="acf" class="inp font-mono text-xs mt-1" rows="4" placeholder="const firebaseConfig = { apiKey: ..., projectId: ... };"></textarea><button class="btn mt-2" onclick="connectAdm()">Hubungkan & muat data</button></details>
 <details class="text-xs text-slate-500"><summary class="cursor-pointer font-semibold">Langkah singkat penggunaan</summary><ol class="list-decimal pl-5 mt-2 space-y-1">${STEPS.map(s=>`<li>${s}</li>`).join('')}</ol></details></div></div>`}
function doReg(){const e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value,m=$('#am');
 if(!/^\S+@\S+\.\S+$/.test(e))return m.textContent='Masukkan email yang valid.';

/* --- Publikasi --- */
function snap(){const ex={},meta={inst:S.inst,title:S.title||'',themes:S.themes||{},ann:S.ann||{},lv:levels(),exams:[],classes:S.classes.map(c=>({name:c.name,students:c.students.map(s=>({no:s.no,name:s.name,h:hs(s.pass+s.no)}))}))};
 S.exams.filter(e=>e.pub).forEach(e=>{const{qs,...hd}=e;meta.exams.push(hd);ex[e.id]=e});return{meta,ex}}
const isDirty=()=>hs(JSON.stringify(snap()))!=S.pubHash;
window.dirtyUpd=()=>{const b=$('#pubb');if(!b)return;const d=isDirty();b.innerHTML=`<i class="fa fa-cloud-arrow-up mr-1"></i>${d?'Publikasikan perubahan':'Sudah terpublikasi'}`;b.style.background=d?'#f59e0b':'#16a34a'};
async function publish(){
 const P=snap();S.pubHash=hs(JSON.stringify(P));P.meta.t=Date.now();
 try{localStorage.setItem(PUB,JSON.stringify(P))}catch(e){alert('Penyimpanan lokal penuh. Kurangi gambar pada soal.')}
 sv();
 if(cfgOn()){try{await cput('pub','meta',P.meta);for(const id in P.ex)await cput('pub','ex_'+id,P.ex[id]);await pushAdmin()}catch(e){alert('Unggah ke Firebase gagal: '+cloudHint(e.message))}}
 if(ghOn()){
  try{const live=await ghPublish(P);
   if(live){ghMsg('✓ Selesai! Link ujian sudah aktif dan siap dibagikan.','text-green-600');tab='kelas';L=null}
   else ghMsg('Data sudah terkirim ke GitHub, tetapi situs belum aktif. Tunggu 1–3 menit lalu buka link untuk mengecek.','text-amber-600')}
  catch(e){ghMsg('Gagal: '+ghHint(e),'text-red-600');alert('Publikasi ke GitHub gagal: '+ghHint(e));tab='set'}
 }else if(!cfgOn()){tab='set';toast('Hubungkan akun GitHub dulu agar link ujian bisa dipakai peserta.')}
 draw()}

/* --- GitHub: publikasi otomatis --- */
let GHS={t:'',c:'text-slate-600'},GHPOLL=6000;
const ghOn=()=>!!(S.cfg&&S.cfg.gh&&S.cfg.gh.token);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function ghMsg(t,c='text-slate-600'){GHS={t,c};const e=$('#ghm');if(e){e.textContent=t;e.className='text-sm '+c}toast(t)}
async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',body:opt.body,headers:Object.assign({Accept:'application/vnd.github+json',Authorization:'Bearer '+S.cfg.gh.token,'X-GitHub-Api-Version':'2022-11-28'},opt.body?{'content-type':'application/json'}:{})});
 let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const er=new Error((j&&j.message)||('HTTP '+r.status));er.status=r.status;throw er}return j}
const b64=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
async function ghPut(path,text,msg,br){const g=S.cfg.gh,u=`/repos/${g.user}/${g.repo}/contents/${path}`;let last;
 for(let t=0;t<4;t++){try{let sha;try{sha=(await gh(u+'?ref='+br)).sha}catch(e){if(e.status!=404)throw e}
  return await gh(u,{method:'PUT',body:JSON.stringify(Object.assign({message:msg,content:b64(text),branch:br},sha?{sha}:{}))})}catch(e){last=e;if(e.status==404||e.status==409){await sleep(GHPOLL/3);continue}throw e}}throw last}

async function ghPublish(P){
 const g=S.cfg.gh;ghMsg('Memeriksa akun GitHub...');
 g.user=(await gh('/user')).login;g.repo=(g.repo||slug()).toLowerCase().replace(/[^a-z0-9._-]/g,'')||slug();
 ghMsg('Menyiapkan repository '+g.repo+'...');let repo;
 try{repo=await gh(`/repos/${g.user}/${g.repo}`)}catch(e){if(e.status!=404)throw e;repo=await gh('/user/repos',{method:'POST',body:JSON.stringify({name:g.repo,description:'EXAM CBT.PLUS - ujian online',private:false,auto_init:true})})}
 const br=repo.default_branch||'main';let has=true;
 try{await gh(`/repos/${g.user}/${g.repo}/contents/index.html?ref=${br}`)}catch(e){if(e.status==404)has=false;else throw e}
 if(!has||g.updApp){const src=await appSrc();if(!src)throw new Error('NEED_SRC');ghMsg('Mengunggah aplikasi...');await ghPut('index.html',src,'Perbarui aplikasi EXAM CBT.PLUS',br);g.updApp=false}
 ghMsg('Mengunggah data ujian...');await ghPut('data.json',JSON.stringify(P),'Publikasi data ujian',br);
 try{await gh(`/repos/${g.user}/${g.repo}/pages`)}catch(e){if(e.status!=404)throw e;ghMsg('Mengaktifkan GitHub Pages...');try{await gh(`/repos/${g.user}/${g.repo}/pages`,{method:'POST',body:JSON.stringify({source:{branch:br,path:'/'}})})}catch(x){if(x.status!=409)throw x}}
 S.cfg.base=g.repo.toLowerCase()==g.user.toLowerCase()+'.github.io'?`https://${g.user}.github.io/`:`https://${g.user}.github.io/${g.repo}/`;g.last=P.meta.t;sv();
 let live=false;for(let i=0;i<50&&!live;i++){try{const r=await fetch(S.cfg.base+'data.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();live=!!(j.meta&&j.meta.t===P.meta.t)}}catch(e){}
  if(!live){ghMsg(`Menunggu GitHub Pages aktif (${Math.round(i*GHPOLL/1000)} detik)... biasanya 1–3 menit.`);await sleep(GHPOLL)}}
 return live}

const RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}";
function cloudHint(m){m=String(m||'');
 if(/API key not valid|API_KEY_INVALID/i.test(m))return 'API Key salah. Salin ulang apiKey dari Firebase.';
 if(/PERMISSION_DENIED|Missing or insufficient/i.test(m))return 'Aturan (Rules) Firestore belum benar. Tempel aturan dari panduan lalu klik Publish.';
 if(/NOT_FOUND|does not exist|has not been used|disabled/i.test(m))return 'Database Firestore belum dibuat atau Project ID salah. Buat di Build → Firestore Database → Create database.';
 if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Tidak bisa terhubung ke internet.';
 return m}
function parseCfg(t){const g=k=>(t.match(new RegExp(k+'\\s*[:=]\\s*["\']([^"\']+)["\']'))||[])[1];let o={key:g('apiKey'),pid:g('projectId')};
 if(!o.key||!o.pid)try{const j=JSON.parse(t);o={key:j.apiKey,pid:j.projectId}}catch(e){}return o}
function pasteCfg(){const o=parseCfg($('#pcf').value);if(!o.key||!o.pid)return alert('Konfigurasi tidak terbaca. Salin seluruh blok firebaseConfig dari Firebase (harus memuat apiKey dan projectId).');S.cfg.pid=o.pid;S.cfg.key=o.key;sv();draw();toast('✓ Konfigurasi terbaca. Klik Tes koneksi.')}
async function testCloud(){const t=$('#tc');t.textContent='Menguji...';t.className='text-sm';if(!cfgOn()){t.textContent='Isi Project ID dan Web API Key dulu.';t.className='text-sm text-red-600';return}
 try{await cput('pub','ping',{t:Date.now()});t.textContent='✓ Terhubung. Sekarang klik Publikasikan.';t.className='text-sm text-green-600'}catch(e){t.textContent='Gagal: '+cloudHint(e.message);t.className='text-sm text-red-600'}}
async function pushAdmin(){const{exams,cfg,...core}=S;core.acc=ld(ACC,null);await cput('adm','core',core);for(const e of exams)await cput('adm','ex_'+e.id,e);await cput('adm','idx',{ids:exams.map(e=>e.id),t:Date.now()})}
async function pullAdmin(){const idx=await cget('adm','idx');if(!idx)throw new Error('Belum ada data admin online. Klik Publikasikan atau Simpan data admin di perangkat utama dulu.');
 const core=await cget('adm','core'),exams=[];for(const id of idx.ids){const e=await cget('adm','ex_'+id);if(e)exams.push(e)}
 const cfg=S.cfg;if(core.acc)localStorage.setItem(ACC,JSON.stringify(core.acc));delete core.acc;S=Object.assign({inst:{name:'',logo:''},lv:[],themes:{},ann:{},classes:[]},core,{exams,cfg});sv()}
async function saveAdm(){const t=$('#tc');if(!cfgOn()){t.textContent='Isi Project ID dan Web API Key dulu.';t.className='text-sm text-red-600';return}t.textContent='Menyimpan...';try{await pushAdmin();t.textContent='✓ Data admin tersimpan online.';t.className='text-sm text-green-600'}catch(e){t.textContent='Gagal: '+cloudHint(e.message);t.className='text-sm text-red-600'}}
async function loadAdm(){if(!cfgOn())return alert('Isi Project ID dan Web API Key dulu.');if(!confirm('Data admin di perangkat ini akan diganti dengan data dari online. Lanjutkan?'))return;try{await pullAdmin();draw();toast('✓ Data admin dimuat dari online')}catch(e){alert('Gagal: '+cloudHint(e.message))}}
async function connectAdm(){const o=parseCfg($('#acf').value);if(!o.key||!o.pid)return alert('Konfigurasi tidak terbaca. Salin seluruh blok firebaseConfig dari Firebase.');S.cfg.pid=o.pid;S.cfg.key=o.key;sv();try{await pullAdmin();toast('✓ Data dan akun admin dimuat');authV()}catch(e){alert('Gagal: '+cloudHint(e.message))}}
function bak(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({S,R:rs()})],{type:'application/json'}));a.download='Backup_EXAM_CBT_PLUS.json';a.click()}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const o=JSON.parse(e.target.result);if(!o.S)throw 0;if(!confirm('Data saat ini akan diganti. Lanjutkan?'))return;S=Object.assign(S,o.S);localStorage.setItem(R,JSON.stringify(o.R||{}));sv();draw();toast('Data berhasil dipulihkan')}catch(x){alert('File cadangan tidak valid.')}};r.readAsText(f)}

/* --- Ujian: daftar & editor --- */
function ujianV(){
 if(!eid){const A=S.exams.filter(e=>e.lvl==L);return `<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">Jadwal & soal KELAS ${esc(L)}</h3><button class="btn" onclick="newE()"><i class="fa fa-plus mr-1"></i>Ujian baru</button></div>
 <div class="grid md:grid-cols-2 gap-3">${A.length?A.map(e=>`<div class="card"><b>${esc(e.subject||'(tanpa nama)')}</b> <span class="text-xs px-2 py-0.5 rounded-full ${e.pub?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}">${e.pub?'Aktif':'Draf'}</span><p class="text-sm text-slate-500 mt-1">${e.cls?'Kelas '+esc(e.cls):'Semua kelas'} · ${e.date} · ${e.start}–${e.end} · ${e.qs.length} soal</p>
 <div class="mt-3 flex gap-2 flex-wrap"><button class="btn" onclick="eid='${e.id}';qi=0;draw()">Buka</button><button class="btn2" onclick="dupE('${e.id}')">Duplikat</button><button class="btn2 text-red-600" onclick="delE('${e.id}')">Hapus</button></div></div>`).join(''):'<div class="card text-slate-500 md:col-span-2 text-center py-10">Belum ada ujian. Buat ujian baru untuk mengatur jadwal dan soal.</div>'}</div>`}
 const e=cur(),f=(l,k,t='text',x='')=>`<div><label class="lbl">${l}</label><input type="${t}" class="inp" value="${esc(e[k]??'')}" ${x} onchange="e_('${k}',this.value,'${t}')"></div>`;
 return `<button class="btn2 mb-3" onclick="eid=null;draw()"><i class="fa fa-arrow-left mr-1"></i>Daftar ujian</button>
 <div class="card mb-4"><h3 class="font-bold mb-3">Jadwal, durasi & keamanan</h3><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
 ${f('Mata pelajaran','subject')}
 <div><label class="lbl">Kelas peserta (opsional)</label><select class="inp" onchange="e_('cls',this.value)"><option value="">Semua kelas KELAS ${esc(L)}</option>${S.classes.filter(c=>lvl(c.name)==L).map(c=>`<option ${e.cls==c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 ${f('Tanggal ujian','date','date')}${f('Jam mulai','start','time')}${f('Jam selesai','end','time')}
 ${f('Durasi ujian (menit)','dur','number','min=1')}${f('Minimal waktu sebelum boleh selesai (menit)','min','number','min=0')}${f('Maks. pelanggaran pindah tab','maxV','number','min=1')}
 ${f('Token ujian (opsional)','token','text','placeholder="kosongkan jika tanpa token"')}
 <div><label class="lbl">Mode poin</label><select class="inp" onchange="e_('ptsMode',this.value)"><option value="auto">Otomatis (bobot sama)</option><option value="manual" ${e.ptsMode=='manual'?'selected':''}>Manual (poin per soal)</option></select></div>
 <div><label class="lbl">Tampilkan nilai ke siswa</label><select class="inp" onchange="e_('showRes',this.value=='1')"><option value="0">Nonaktif</option><option value="1" ${e.showRes?'selected':''}>Aktif</option></select></div>
 <div><label class="lbl">Anti copy / paste</label><select class="inp" onchange="e_('noCopy',this.value=='1')"><option value="1">Aktif</option><option value="0" ${e.noCopy===false?'selected':''}>Nonaktif</option></select></div></div></div>
 ${impV()}${aiV()}
 <div class="card"><div class="flex justify-between items-center mb-3 flex-wrap gap-2"><h3 class="font-bold">Soal per slide (${e.qs.length})</h3><button class="btn" onclick="cur().qs.push(newQ('pg'));qi=cur().qs.length-1;sv();draw()"><i class="fa fa-plus mr-1"></i>Slide</button></div>
 <div class="flex flex-wrap gap-1 mb-3">${e.qs.map((q,i)=>`<button onclick="qi=${i};draw()" class="w-9 h-9 rounded-lg text-sm font-semibold ${i==qi?'bg-indigo-600 text-white':'bg-slate-100'}">${i+1}</button>`).join('')}</div>${qEd()}</div>
 <div class="card mt-4 bg-indigo-50 border-indigo-200"><button class="btn" onclick="fin()"><i class="fa fa-cloud-arrow-up mr-1"></i>Simpan & Publikasikan</button> <span class="text-xs text-slate-500 ml-2">Perubahan berikutnya cukup dipublikasikan lagi; link tetap sama.</span>
 ${e.pub?`<div class="mt-3">${shareV(L)}</div>`:''}</div>`}
function e_(k,v,t){cur()[k]=t=='number'?+v:v;sv()}
function newE(){const e={id:uid(),subject:'',lvl:L,cls:'',date:new Date().toISOString().slice(0,10),start:'07:30',end:'09:30',dur:90,min:45,maxV:5,ptsMode:'auto',showRes:false,noCopy:true,token:'',qs:[],pub:false};S.exams.push(e);eid=e.id;qi=0;sv();draw()}
function dupE(id){const o=S.exams.find(e=>e.id==id),e=JSON.parse(JSON.stringify(o));e.id=uid();e.subject+=' (salinan)';e.pub=false;S.exams.push(e);sv();draw()}
function delE(id){if(confirm('Hapus ujian ini?')){S.exams=S.exams.filter(e=>e.id!=id);sv();draw()}}
async function fin(){
 const e=cur();if(!e.subject||!e.qs.length)return alert('Lengkapi mata pelajaran dan minimal satu soal.');
 if(e.start>=e.end)return alert('Jam selesai harus setelah jam mulai.');
 const bad=e.qs.findIndex(q=>!q.q.trim()&&!q.img||(q.t=='pg'||q.t=='pgk')&&(q.o.some((o,i)=>!o.trim()&&!(q.oi&&q.oi[i]))||q.t=='pgk'&&!q.k.length)||q.t=='match'&&(q.O.length<2||q.O.some((o,i)=>!o.trim()&&!(q.oi&&q.oi[i]))||!q.L.length||q.L.some(x=>!x.s.trim()||x.k>=q.O.length))||q.t=='tf'&&q.i.some(x=>!x.s.trim()));
 if(bad>=0){qi=bad;draw();return alert('Soal nomor '+(bad+1)+' belum lengkap.')}
 e.pub=true;sv();await publish()}

/* --- Editor soal --- */
function newQ(t){const b={t,q:'',pts:1};
 if(t=='pg')return{...b,o:['','','',''],k:0};if(t=='pgk')return{...b,o:['','','',''],k:[]};
 if(t=='match')return{...b,O:['',''],L:[{s:'',k:0},{s:'',k:0}]};if(t=='tf')return{...b,i:[{s:'',v:true},{s:'',v:false}]};if(t=='isian')return{...b,ans:''};return{...b,kw:''}}
function qEd(){
 const q=Q();if(!q)return '<p class="text-center text-slate-400 py-6">Belum ada slide soal. Klik “Slide” untuk menambah.</p>';
 let h=`<div class="flex gap-2"><select class="inp" onchange="chT(this.value)">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${q.t==k?'selected':''}>${v}</option>`).join('')}</select><button class="btn2 text-red-600" onclick="cur().qs.splice(qi,1);qi=Math.max(0,qi-1);sv();draw()"><i class="fa fa-trash"></i></button></div>
 <textarea class="inp mt-2" rows="3" placeholder="Tulis pertanyaan atau instruksi" oninput="Q().q=this.value;sv()">${esc(q.q)}</textarea>`+imgC(null)+`<div class="mt-2 w-44"><label class="lbl">Poin soal (mode manual)</label><input type="number" min="0" step="0.5" class="inp" value="${q.pts??1}" oninput="Q().pts=+this.value;sv()"></div>`;
 if(q.t=='pg'||q.t=='pgk')h+=`<p class="text-xs text-slate-500 mt-3">Tandai ${q.t=='pg'?'satu':'semua'} jawaban yang benar.</p>`+q.o.map((o,i)=>`<div class="mt-2"><div class="flex gap-2 items-center"><input type="${q.t=='pg'?'radio':'checkbox'}" name="k" ${(q.t=='pg'?q.k===i:q.k.includes(i))?'checked':''} onchange="setK(${i},this.checked)"><b class="w-5">${'ABCDEFGH'[i]}</b><input class="inp" value="${esc(o)}" oninput="Q().o[${i}]=this.value;sv()"><button class="text-red-500 px-2" onclick="delO(${i})"><i class="fa fa-xmark"></i></button></div>${imgC(i)}</div>`).join('')+(q.o.length<8?`<button class="btn2 mt-2" onclick="Q().o.push('');sv();draw()">+ Opsi</button>`:'');
 if(q.t=='match')h+=`<div class="grid md:grid-cols-2 gap-4 mt-3"><div><label class="lbl">1. Daftar pilihan jawaban (tambahkan pengecoh agar tidak bisa ditebak)</label>${q.O.map((o,i)=>`<div class="mt-2"><div class="flex gap-2 items-center"><b class="w-5">${i+1}</b><input class="inp" value="${esc(o)}" oninput="Q().O[${i}]=this.value;sv()" onchange="draw()"><button class="text-red-500 px-2" onclick="delM(${i})"><i class="fa fa-xmark"></i></button></div>${imgC(i)}</div>`).join('')}<button class="btn2 mt-2" onclick="Q().O.push('');sv();draw()">+ Pilihan</button></div>
 <div><label class="lbl">2. Pernyataan dan kunci jawabannya</label>${q.L.map((x,i)=>`<div class="flex gap-2 mt-2"><input class="inp" placeholder="Pernyataan" value="${esc(x.s)}" oninput="Q().L[${i}].s=this.value;sv()"><select class="inp w-40" onchange="Q().L[${i}].k=+this.value;sv()">${q.O.map((o,j)=>`<option value="${j}" ${x.k==j?'selected':''}>${j+1}. ${esc(o).slice(0,22)}</option>`).join('')}</select><button class="text-red-500 px-2" onclick="Q().L.splice(${i},1);sv();draw()"><i class="fa fa-xmark"></i></button></div>`).join('')}<button class="btn2 mt-2" onclick="Q().L.push({s:'',k:0});sv();draw()">+ Pernyataan</button></div></div>`;
 if(q.t=='tf')h+=q.i.map((x,i)=>`<div class="flex gap-2 mt-2"><input class="inp" placeholder="Pernyataan" value="${esc(x.s)}" oninput="Q().i[${i}].s=this.value;sv()"><select class="inp w-32" onchange="Q().i[${i}].v=this.value=='1';sv()"><option value="1" ${x.v?'selected':''}>Benar</option><option value="0" ${!x.v?'selected':''}>Salah</option></select><button class="text-red-500 px-2" onclick="Q().i.splice(${i},1);sv();draw()"><i class="fa fa-xmark"></i></button></div>`).join('')+`<button class="btn2 mt-2" onclick="Q().i.push({s:'',v:true});sv();draw()">+ Pernyataan</button>`;
 if(q.t=='isian')h+=`<div class="mt-3"><label class="lbl">Kunci jawaban (opsional)</label><input class="inp" value="${esc(q.ans||'')}" placeholder="contoh: Jakarta; DKI Jakarta" oninput="Q().ans=this.value;sv()"><p class="text-xs text-slate-500 mt-1">Pisahkan dengan titik koma (;) jika ada beberapa jawaban yang diterima. Huruf besar/kecil diabaikan; angka 0,5 dan 0.5 dianggap sama. Kosongkan jika tidak dinilai otomatis; isian tanpa kunci tidak dihitung dalam nilai.</p></div>`;
 if(q.t=='essay')h+=`<div class="mt-3"><label class="lbl">Kunci jawaban: kata kunci (opsional, pisahkan dengan koma)</label><input class="inp" value="${esc(q.kw)}" placeholder="fotosintesis, klorofil, cahaya matahari" oninput="Q().kw=this.value;sv()"><p class="text-xs text-slate-500 mt-1">Isi untuk koreksi otomatis berdasarkan kecocokan kata kunci. Kosongkan jika essay tidak dinilai otomatis; essay tanpa kata kunci tidak dihitung dalam nilai.</p></div>`;
 return h}
function setK(i,c){const q=Q();if(q.t=='pg')q.k=i;else q.k=c?[...new Set([...q.k,i])]:q.k.filter(x=>x!=i);sv()}
function delO(i){const q=Q();if(q.o.length<=2)return;q.o.splice(i,1);q.oi&&q.oi.splice(i,1);q.k=q.t=='pg'?(q.k==i?0:q.k>i?q.k-1:q.k):q.k.filter(x=>x!=i).map(x=>x>i?x-1:x);sv();draw()}
function delM(i){const q=Q();if(q.O.length<=2)return;q.O.splice(i,1);q.oi&&q.oi.splice(i,1);q.L.forEach(x=>{x.k=x.k==i?0:x.k>i?x.k-1:x.k});sv();draw()}
function imgC(i){const q=Q(),src=i==null?q.img:(q.oi||[])[i];
 return `<div class="flex items-center gap-2 mt-2">${src?`<img src="${src}" class="h-16 rounded border"><button class="text-red-500 text-xs" onclick="rmI(${i})">Hapus gambar</button>`:''}<label class="text-xs text-indigo-600 cursor-pointer font-semibold"><i class="fa fa-image mr-1"></i>${src?'Ganti':'Tambah'} gambar<input type="file" accept="image/*" hidden onchange="upI(${i},this)"></label></div>`}

/* --- Impor dari Claude & AI --- */
const FMT=`Balas HANYA dengan array JSON (tanpa teks lain). Setiap elemen salah satu bentuk:
{"t":"pg","q":"pertanyaan","o":["A","B","C","D"],"k":0}  (k = nomor indeks jawaban benar, mulai 0)
{"t":"pgk","q":"..","o":["opsi1","opsi2","opsi3","opsi4"],"k":[0,2]}
{"t":"match","q":"..","O":["pilihan jawaban termasuk 1-2 pengecoh"],"L":[{"s":"pernyataan","k":0}]}  (k = indeks di O)
{"t":"tf","q":"..","i":[{"s":"pernyataan","v":true}]}
{"t":"isian","q":"..","ans":"jawaban1; jawaban2"}  (ans boleh dikosongkan)
{"t":"essay","q":"..","kw":"kata1, kata2, kata3"}  (kw boleh dikosongkan)`;
function normQ(x){if(!x||!T[x.t]||!x.q)return null;const q=newQ(x.t);q.q=String(x.q);
 if(x.t=='pg'||x.t=='pgk'){if(!Array.isArray(x.o)||x.o.length<2)return null;q.o=x.o.map(String);q.k=x.t=='pg'?Math.min(Math.max(+x.k||0,0),q.o.length-1):[].concat(x.k).map(Number)}
 if(x.t=='match'){if(!x.O||!x.L)return null;q.O=x.O.map(String);q.L=x.L.map(l=>({s:String(l.s),k:Math.min(Math.max(+l.k||0,0),q.O.length-1)}))}
 if(x.t=='tf'){if(!x.i)return null;q.i=x.i.map(l=>({s:String(l.s),v:!!l.v}))}
 if(x.t=='isian')q.ans=String(x.ans||'');
 if(x.t=='essay')q.kw=String(x.kw||'');return q}
function impV(){return `<details class="card mb-4"><summary class="font-bold cursor-pointer"><i class="fa fa-file-import text-indigo-600 mr-1"></i>Impor soal dari Claude (tanpa API key)</summary><div class="mt-3 space-y-2">

 <button class="btn2" onclick="navigator.clipboard.writeText(FMT);this.textContent='Format tersalin!'"><i class="fa fa-copy mr-1"></i>Salin format</button>
 <textarea id="imt" class="inp font-mono" rows="6" placeholder='[{"t":"pg","q":"...","o":["..",".."],"k":0}]'></textarea><button class="btn" onclick="impSoal()">Impor sebagai slide</button></div></details>`}
function impSoal(){const t=$('#imt').value;try{const arr=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1)),ok=arr.map(normQ).filter(Boolean);
 if(!ok.length)return alert('Tidak ada soal valid yang terbaca.');
 cur().qs.push(...ok);qi=cur().qs.length-ok.length;sv();draw();alert(ok.length+' soal berhasil diimpor'+(arr.length>ok.length?' ('+(arr.length-ok.length)+' dilewati karena format tidak valid)':'')+'.')}
 catch(e){alert('Format JSON tidak valid. Pastikan seluruh jawaban Claude tersalin utuh.')}}

 <div class="md:col-span-3"><label class="lbl">Prompt untuk AI</label><textarea id="aip" class="inp" rows="3" placeholder="Buatkan soal IPA kelas 9 bab Listrik Statis, tingkat sedang"></textarea></div>

async function genAI(){
 const p=$('#aip').value.trim(),n=+$('#ain').value||5,ts=[...document.querySelectorAll('.ait:checked')].map(x=>x.value),key=$('#aik').value.trim(),m=$('#aim'),b=$('#aib');

 try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:8000,system:'Kamu pembuat soal ujian sekolah berbahasa Indonesia. '+FMT,messages:[{role:'user',content:`Buat ${n} soal. Tipe yang boleh dipakai: ${ts.join(', ')}. Permintaan: ${p}`}]})}),d=await r.json();

function togF(){FO=!FO;sp();cl();stQ()}
function togN(){NV=!NV;sp();cl();stQ()}
function setA(v,keep){res.ans[ci]=v;sv2();if(keep){const n=$('#nv');n&&(n.innerHTML=navH());$('#st').innerHTML=stI()}else stQ()}
function tog(i,c){const a=new Set(res.ans[ci]||[]);c?a.add(i):a.delete(i);res.ans[ci]=[...a];sv2();stQ()}
function subA(i,v){const q=ex.qs[ci],n=(q.t=='match'?q.L:q.i).length,a=Array.isArray(res.ans[ci])?res.ans[ci]:Array(n).fill(null);
 a[i]=v===''?null:q.t=='match'?+v:v=='true';res.ans[ci]=a;sv2();stQ()}
function dbt(){res.dbt[ci]=!res.dbt[ci];sv2();stQ()}

/* --- Selesai / keluar --- */
function resH(){const n=ex.qs.length,ok=ex.qs.filter((q,i)=>!noKey(q)&&sc(q,res.ans[i])>=.999).length,chips=ex.qs.map((q,i)=>{const v=sc(q,res.ans[i]);return `<span class="inline-block w-8 h-8 leading-8 rounded text-xs font-bold text-white ${noKey(q)?'bg-slate-400':v>=.999?'bg-green-500':v>0?'bg-yellow-500':'bg-red-500'}">${i+1}</span>`}).join(' ');
 return `<div class="rounded-xl bg-slate-50 p-3 mt-3 text-slate-700 font-normal"><div class="text-xs text-slate-500">Nilai akhir</div><div class="text-4xl font-extrabold text-indigo-700">${res.score}</div><div class="text-xs text-slate-500">${ok} benar penuh dari ${n} soal</div><div class="flex flex-wrap gap-1 justify-center mt-2">${chips}</div><div class="text-[10px] text-slate-400 mt-1">Hijau benar · kuning sebagian · merah salah · abu belum dinilai</div></div>`}
const rx=()=>ex.showRes?resH():'';
function done(){
 const el=(Date.now()-res.start)/60000;
 if(el<ex.min)return mdl('fa-hourglass-half','text-amber-500',`PERINGATAN SISTEM!<br><span class="text-base font-semibold">Anda baru bisa menyelesaikan ujian setelah ${ex.min} menit. Sisa waktu minimal ${Math.ceil(ex.min-el)} menit.</span>`,[['Kembali ke Soal',B1,'cl()']]);
 const un=ex.qs.filter((_,i)=>!ansd(i)).length,db=ex.qs.filter((_,i)=>res.dbt[i]).length;
 if(un)return mdl('fa-circle-exclamation','text-slate-400',`HEIII ${NM()} ADA ${un} SOAL YANG BELUM KAMU JAWAB, SILAHKAN CEK KEMBALI NAVIGASI SOAL YANG BERWARNA ABU`,[['Cek Kembali',B1,'cl()']]);
 if(db)return mdl('fa-triangle-exclamation','text-yellow-500',`HEIII ${NM()} ADA ${db} SOAL YANG MASIH KAMU RAGU-RAGU, SILAHKAN CEK KEMBALI NAVIGASI SOAL YANG BERWARNA KUNING`,[['Cek Kembali',B1,'cl()']]);
 mdl('fa-circle-check','text-green-500',`APAKAH ANDA SUDAH SELESAI DAN APAKAH SUDAH YAKIN DENGAN JAWABAN ANDA?<br><span class="text-sm font-semibold text-slate-500">Jika sudah, silakan klik tombol centang untuk Anda logout.</span>`,[['Batalkan Logout',B2,'cl()'],['<i class="fa fa-check mr-1"></i>Tetap Logout',B1,"cl();submit('Selesai')"]])}
function quit(){mdl('fa-plug-circle-exclamation','text-amber-500',`Ada kendala?<br><span class="text-sm font-semibold text-slate-500">Jawaban Anda sudah tersimpan. Anda dapat login ulang untuk melanjutkan. Waktu ujian tetap berjalan.</span>`,[['Batal',B2,'cl()'],['Keluar & Login Ulang',B3,'doQuit()']])}
function doQuit(){run=false;res.st='Keluar';sv2();flush();lout()}
function submit(st,quiet){
 if(!run)return;run=false;clearInterval(tt);res.st=st;res.end=Date.now();res.score=total(ex,res.ans);sv2();flush();MY[ex.id]=res;document.body.classList.remove('noc');
 if(document.fullscreenElement)document.exitFullscreen?.();
 if(!quiet)box(`<i class="fa fa-circle-check text-5xl text-green-500 anim"></i><h1 class="text-xl font-bold">Ujian ${esc(ex.subject)} selesai</h1><p class="text-sm text-slate-500">Jawaban Anda tersimpan. Terima kasih, ${esc(me.name)}.</p>${rx()}<div class="flex gap-2"><button class="btn text-white flex-1" onclick="stWait()">Ruang tunggu</button><button class="btn2 flex-1" onclick="lout()">Logout</button></div>`)}
function timeUp(){if(!run)return;submit('Selesai',1);mdl('fa-clock','text-red-500',`HEIII ${NM()} SEPERTINYA WAKTU PENGERJAAN SUDAH BERAKHIR, KAMU TIDAK DAPAT MELANJUTKANNYA LAGI, SILAHKAN LOGOUT${rx()}`,[['Logout',B3,'lout()']])}

/* --- Anti nyontek & anti copy --- */
function stopS(){clearTimeout(SP);try{speechSynthesis.cancel()}catch(e){}}
function siren(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';g.gain.value=.2;o.connect(g);g.connect(AC.destination);
 for(let i=0;i<6;i++){o.frequency.setValueAtTime(600,t+i*.5);o.frequency.linearRampToValueAtTime(1100,t+i*.5+.25);o.frequency.linearRampToValueAtTime(600,t+i*.5+.5)}o.start(t);o.stop(t+3)}catch(e){}}
function say(m){stopS();SP=setTimeout(()=>{try{const u=new SpeechSynthesisUtterance(m);u.lang='id-ID';u.rate=.95;speechSynthesis.speak(u)}catch(e){}},3100)}
function viol(){
 if(!run||Date.now()-lastV<1500)return;lastV=Date.now();res.viol++;sv2();siren();
 if(res.viol>=ex.maxV){submit('Diblokir',1);const m=`HEIII ${me.name.toUpperCase()} BATAS BLOKIRMU SUDAH HABIS, SILAHKAN LOGOUT DAN MENGAKHIRI UJIAN`;say(m);return mdl('fa-ban','text-red-600',esc(m)+rx(),[['Logout',B3,'lout()']],'bg-red-800/95')}
 const m=`HEIII ${me.name.toUpperCase()} SEPERTINYA KAMU TERBLOKIR SISTEM KARENA TIDAK FOKUS UJIAN`;say(m);
 mdl('fa-triangle-exclamation','text-red-600',`${esc(m)}<br><span class="text-sm font-semibold text-slate-500">Blokir ke-${res.viol} dari ${ex.maxV}. Jika batas habis, ujian berakhir.</span>`,[['Lanjutkan & Tidak Mengulangi',B1,'stopS();cl();stQ()']],'bg-red-700/95')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)viol()});
window.addEventListener('blur',viol);
const nocp=()=>STU&&run&&ex&&ex.noCopy!==false;
['contextmenu','copy','paste','cut','dragstart'].forEach(v=>document.addEventListener(v,e=>{if(nocp())e.preventDefault()}));
document.addEventListener('selectstart',e=>{const t=e.target.nodeType==3?e.target.parentElement:e.target;if(nocp()&&!/TEXTAREA|INPUT/.test(t.tagName))e.preventDefault()});
document.addEventListener('keydown',e=>{if(nocp()&&(e.ctrlKey||e.metaKey)&&'cvxaups'.includes(e.key.toLowerCase()))e.preventDefault()});

/* ---- Mulai ---- */
if(STU){document.title='EXAM CBT.PLUS';stLanding()}else draw();
</script></body></html>
